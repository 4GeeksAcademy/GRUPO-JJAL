<div class="container my-5">
    <h1 class="mb-3">Contact</h1>
    <h5 class="text-black text-opacity-50 mb-4">
        Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id ligula porta felis euismod semper.
        Praesent commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus
        commodo.
    </h5>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body bg-secondary bg-opacity-10">
                    <form>
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label fw-semibold px-3 text-end">
                                <strong>Your E-mail</strong>
                            </label>
                            <div class="col-sm-9">
                                <input type="email" class="form-control" placeholder="Your email">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label fw-semibold px-3 text-end">
                                <strong>Your message</strong>
                            </label>
                            <div class="col-sm-9">
                                <textarea class="form-control text-body-tertiary" rows="4"
                                    placeholder="Please enter your message here..."></textarea>
                            </div>
                        </div>
                        <div class="text-end">
                            <button type="submit" class="btn btn-primary btn-lg px-4 mt-1 mb-3">
                                Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
